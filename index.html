<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendWise - Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-body">

    <div class="login-container">

        <div class="login-brand">
            <div class="brand-icon">💰</div>

            <h1>SpendWise</h1>

            <p>
                Smart expense tracking for students.
                Manage your money. Reach your goals.
            </p>

            <div class="features">
                <div>✓ Track daily expenses</div>
                <div>✓ Monitor your budget</div>
                <div>✓ Understand your spending</div>
            </div>
        </div>


        <div class="login-card">

            <h2>Welcome Back 👋</h2>
            <p class="subtitle">Login to your expense tracker</p>

            <form id="loginForm">

                <label>Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

                <label>Password</label>

                <div class="password-container">
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                    <button type="button" id="togglePassword">
                        👁
                    </button>
                </div>

                <div class="login-options">
                    <label class="remember">
                        <input type="checkbox">
                        Remember me
                    </label>

                    <a href="#">Forgot Password?</a>
                </div>

                <button type="submit" class="login-button">
                    Login
                </button>

                <p id="loginMessage"></p>

            </form>

            <p class="signup">
                Don't have an account?
                <a href="#">Create Account</a>
            </p>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
